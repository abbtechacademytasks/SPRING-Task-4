databaseChangeLog:
  - changeSet:
      id: 100-1
      author: VagifPashayev
      context: dev
      changes:
        - insert:
            tableName: departments
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: name
                  value: "Development"
              - column:
                  name: location
                  value: "Baku"
              - column:
                  name: phone
                  value: "0124000001"
        - insert:
            tableName: departments
            columns:
              - column:
                  name: id
                  valueNumeric: 2
              - column:
                  name: name
                  value: "Finance"
              - column:
                  name: location
                  value: "Baku"
              - column:
                  name: phone
                  value: "0124000002"
        - insert:
            tableName: departments
            columns:
              - column:
                  name: id
                  valueNumeric: 3
              - column:
                  name: name
                  value: "Support"
              - column:
                  name: location
                  value: "Ganja"
              - column:
                  name: phone
                  value: "0224000003"
        - sql:
            sql: >
              SELECT setval(pg_get_serial_sequence('departments', 'id'),
              COALESCE(MAX(id), 1), MAX(id) IS NOT NULL) FROM departments
      rollback:
        - delete:
            tableName: departments
            where: id IN (1, 2, 3)
        - sql:
            sql: >
              SELECT setval(pg_get_serial_sequence('departments', 'id'),
              COALESCE(MAX(id), 1), MAX(id) IS NOT NULL) FROM departments


databaseChangeLog:
  - changeSet:
      id: 004-1
      author: VagifPashayev
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: authors
      changes:
        - createTable:
            tableName: authors
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_authors
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: VARCHAR(50)

  - changeSet:
      id: 004-2
      author: VagifPashayev
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: books
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_books
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(8,2)
                  constraints:
                    nullable: false
              - column:
                  name: page_count
                  type: INTEGER
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-3
      author: VagifPashayev
      changes:
        - sql:
            sql: >
              ALTER TABLE books
              ADD CONSTRAINT chk_book_price
              CHECK (price >= 0)
      rollback:
        - sql:
            sql: >
              ALTER TABLE books
              DROP CONSTRAINT chk_book_price

  - changeSet:
      id: 004-4
      author: VagifPashayev
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: author_book
      changes:
        - createTable:
            tableName: author_book
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_author_book
                    nullable: false
              - column:
                  name: author_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-5
      author: VagifPashayev
      changes:
        - addUniqueConstraint:
            tableName: author_book
            columnNames: author_id, book_id
            constraintName: uk_author_book

  - changeSet:
      id: 004-6
      author: VagifPashayev
      changes:
        - addForeignKeyConstraint:
            baseTableName: author_book
            baseColumnNames: author_id
            referencedTableName: authors
            referencedColumnNames: id
            constraintName: fk_ab_author

  - changeSet:
      id: 004-7
      author: VagifPashayev
      changes:
        - addForeignKeyConstraint:
            baseTableName: author_book
            baseColumnNames: book_id
            referencedTableName: books
            referencedColumnNames: id
            constraintName: fk_ab_book
